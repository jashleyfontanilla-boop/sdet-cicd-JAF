name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - run: echo ${{vars.STANDARD_USER}}
      - run: echo ${{vars.SUCCESS_PASSWORD}}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}git commit -m "
      - name: Upload test report Allure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-test-report
          path: playwright-report
          retention-days: 7
      - name: Upload test report Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-test-report
          path: test-results
          retention-days: 7